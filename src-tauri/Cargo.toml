[package]
name = "dental"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dental_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.6"
protox = "0.10.0"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"
# native-tls uses the Windows TLS stack (no extra build tools needed).
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
prost = "0.14.6"
prost-types = "0.14.6"
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
zeroize = "1.9.1"
getrandom = "0.4.3"
sysinfo = "0.40.3"
base64 = "0.23.1"
hex = "0.4.3"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
winreg = "0.56.0"
# Same versions Tauri/wry use: to change WebView2 settings Tauri doesn't expose (lockdown.rs).
webview2-com = "0.39"
windows-core = "0.62"


# Argon2 is deliberately expensive (see secure.rs). Unoptimized it is many times
# slower, so it is optimized in debug builds too: offline login and tests stay quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
