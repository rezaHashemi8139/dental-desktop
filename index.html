<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Management Base</title>

    <script>
      // Pick light or dark before the first paint (same rules as src/theme/theme.ts),
      // so the splash below is drawn in the right colors.
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>

    <!-- Splash styles: a plain file in public/, loaded before the app's own CSS. -->
    <link rel="stylesheet" href="/splash.css" />
  </head>

  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <img class="splash-logo" src="/logo.svg" alt="" />
        <div class="splash-title">Smart Management Base</div>
        <div class="splash-spinner"></div>
      </div>
    </div>

    <script>
      // The app name in the last used language (saved by src/i18n/index.ts).
      // The default name above is only seen on the very first launch.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("splashTitle") || "null");
          if (!saved || !saved.title) return;
          var element = document.querySelector(".splash-title");
          element.textContent = saved.title;
          element.dir = saved.dir || "auto";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
