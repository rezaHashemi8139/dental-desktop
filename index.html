<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Management Base</title>

    <script>
      // Pick light or dark before the first paint (same rules as src/theme/theme.ts),
      // so the splash below is drawn in the right colors.
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>

    <!-- Splash styles: a plain file in public/, loaded before the app's own CSS. -->
    <link rel="stylesheet" href="/splash.css" />
  </head>

  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <div class="splash-spinner"></div>
        <div>Smart Management Base</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
