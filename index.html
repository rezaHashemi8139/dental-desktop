<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Management Base</title>

    <script>
      // Pick light or dark before the first paint (same rules as src/theme/theme.ts),
      // so the splash below is drawn in the right colors.
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>

    <style>
      /* Splash shown until React replaces the contents of #root. Plain CSS: the app's styles are not loaded yet. */
      html, body { margin: 0; background: #ffffff; color: #737373; }
      html.dark, html.dark body { background: #0a0a0a; color: #a1a1a1; }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font: 600 15px system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <div class="splash-spinner"></div>
        <div>Smart Management Base</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
